# Keeps the Kuala Cloud project (Supabase free plan) from being paused for
# inactivity: one tiny read a day counts as activity. If the project is
# already paused, the run fails and GitHub emails you.
name: Keep Kuala Cloud awake

on:
  schedule:
    - cron: '17 14 * * *' # every day, 14:17 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/books?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $status"
          if [ "$status" = "540" ]; then
            echo "::error::Kuala Cloud is paused. Open the Supabase dashboard and click Resume project."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Supabase answered HTTP $status"
            exit 1
          fi

      # GitHub switches off scheduled workflows in repos with no activity for
      # 60 days. Re-enabling this workflow on every run resets that clock.
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-alive.yml/enable"
